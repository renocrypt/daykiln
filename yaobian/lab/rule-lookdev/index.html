<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RULE · look development · Yaobian lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #ece7dd; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #panel, #hint {
    position: fixed; left: 16px; right: 16px;
    font: 12px/1.6 ui-monospace, 'SF Mono', Menlo, monospace; color: #2b2723;
  }
  #panel { bottom: 16px; background: rgb(236 231 221 / 0.9); padding: 12px 14px; border-radius: 6px; }
  #readout { margin: 0; white-space: pre; overflow-x: auto; }
  #panel dl { display: grid; grid-template-columns: auto 1fr; gap: 0 14px; margin: 10px 0 0; opacity: 0.8; }
  #panel dt { font-weight: 600; } #panel dd { margin: 0; }
  #hint { top: 16px; opacity: 0.75; transition: opacity 0.6s; pointer-events: none; }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<div id="panel" hidden>
  <pre id="readout"></pre>
  <dl>
    <dt>[ ]</dt><dd>turn the contact angle · T the tiling · M stucco or tile</dd>
    <dt>← → ↑ ↓</dt><dd>move the sun · G the derivation over the wall</dd>
    <dt>C</dt><dd>capture the study to $TMPDIR/yaobian/renders/ · H this panel</dd>
  </dl>
</div>
<div id="hint">drawing the rule…</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
